# Suite `rag-app`: la app de ejemplo sobre el golden set sintético de 200 casos.
# El modelo y la temperatura del juez NO van aquí: son los de su prompt (prompts/judge_faithfulness.md).
suite: rag-app
golden: evals/golden/rag-app-v1
sut:
  model: qwen3.5:9b-mlx            # el sistema bajo prueba. R12: nunca el mismo que el juez
  outputs: evals/suites/rag-app/sut/base.jsonl
judge:
  id: faithfulness
  # gemma4 razona por defecto y gasta max_tokens en ello sin llegar al veredicto (medido el 2026-10-07).
  # Entra en la clave de caché: cambiarlo son otras 200 llamadas.
  sampling: { seed: 7, max_tokens: 8, reasoning_effort: none }
cache: evals/suites/rag-app/cache.jsonl

# Variantes del sistema bajo prueba: la misma suite y el mismo juez, con el sistema cambiado a propósito.
# Cada una es un puñado de variables de entorno de examples/rag-app (solo RAG_*). Sus salidas se graban en
# sut/<variante>.jsonl. Las cuatro degradaciones son las canónicas de RULES §5: están fijadas y no se
# negocian. Contra ellas se mide si la puerta detecta una caída real (F7).
variants:
  base: {}
  contexto-50: { RAG_CONTEXT_KEEP: "0.5" }          # (a) contexto recortado al 50 %
  modelo-pequeno: { RAG_MODEL: "qwen3.5:4b-mlx" }   # (b) modelo sustituido por uno más pequeño
  docs-aleatorios-20: { RAG_RANDOM_DOCS: "0.2" }    # (c) 20 % de los documentos recuperados, aleatorios
  temperatura-1.2: { RAG_TEMPERATURE: "1.2" }       # (d) temperatura del sistema a 1,2
