# Corpus fijo de G-PRICE-REPRO: 12 informes de coste y el total que cada uno registró.
#
# provenance: sintetico_declarado. Ni las llamadas ni los precios son tráfico real: son casos construidos
# para cubrir, uno a uno, las reglas de cálculo de docs/CONTRACTS/pricing-table.md §3.
#
# `recorded_total_eur` se calculó A MANO, con la aritmética escrita en `calculo`, y NO con el código que
# la meta mide: si saliera de `cost_of`, recalcular daría cero por construcción y no demostraría nada.
# Es texto y no número para que ningún float lo toque.
#
# Qué mide la meta: que recalcular hoy cada informe, con la tabla vigente EN LA FECHA de cada llamada, da el
# mismo total exacto. Estos totales no se editan nunca. Si un cambio de código los mueve, el código está mal.
version: 1
haiku: &haiku anthropic.claude-haiku-4-5
qwen: &qwen qwen3.5:9b-mlx
reports:
  - id: R01-entrada-y-salida
    regla: "§3.1 precio distinto de entrada y de salida"
    calculo: "1,5 x 0,0008 + 0,5 x 0,004 = 0,0032 USD; x 0,92 = 0,002944 EUR"
    recorded_total_eur: "0.002944"
    calls:
      - { at: "2026-08-15T12:00:00+00:00", model: *haiku, input: 1500, output: 500 }

  - id: R02-solo-entrada
    regla: "§3.1"
    calculo: "10 x 0,0008 = 0,008 USD; x 0,92 = 0,00736 EUR"
    recorded_total_eur: "0.00736"
