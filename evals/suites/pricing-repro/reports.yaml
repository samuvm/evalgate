    recorded_total_eur: "0.009816"
    calls:
      - { at: "2026-08-31T23:59:59+00:00", model: *haiku, input: 1000, output: 1000 }
      - { at: "2026-09-01T00:00:00+00:00", model: *haiku, input: 1000, output: 1000 }

  - id: R06-volumen-septiembre
