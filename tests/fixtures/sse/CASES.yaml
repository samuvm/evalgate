# Los 12 casos límite de SSE que F2 debe cubrir. La lista manda en docs/PLAN.md §3 y aquí solo se declara
# qué fichero cubre cada uno: `scripts/rules/sse_corpus_coverage.py` compara este `caso` LETRA A LETRA con
# el de PLAN.md, así que no se puede renombrar un caso para que encaje con un fixture que hace otra cosa.
casos:
  - caso: "corte de cliente"
    fixture: 01-client-disconnect.sse
  - caso: "corte de proveedor"
    fixture: 02-upstream-cutoff.sse
  - caso: "chunk malformado"
    fixture: 03-malformed-chunk.sse
  - caso: "timeout a mitad"
    fixture: 04-timeout-midstream.sse
  - caso: "chunk final de `usage` ausente"
    fixture: 05-missing-usage-chunk.sse
  - caso: "`[DONE]` sin `usage`"
    fixture: 06-done-without-usage.sse
  - caso: "unicode partido entre chunks"
    fixture: 07-unicode-split.sse
  - caso: "keep-alive vacío"
    fixture: 08-keepalive-empty.sse
  - caso: "error a mitad del stream"
    fixture: 09-error-midstream.sse
  - caso: "doble `[DONE]`"
    fixture: 10-double-done.sse
  - caso: "chunk con `finish_reason` inesperado"
    fixture: 11-unexpected-finish-reason.sse
  - caso: "stream de longitud 0"
    fixture: 12-zero-length-stream.sse

# Fixtures que no son de los 12 de PLAN.md §3. El plan es de solo lectura y fija un SUELO, no un techo:
# los proveedores reales hacen cosas que esa lista no enumera. Cada extra lleva por qué existe y de dónde
# salió, y la regla exige que algún test lo consuma, igual que a los otros.
extra:
  - fixture: 13-reasoning-tokens.sse
    porque: >
      Modelo de razonamiento: `delta.reasoning` lleva texto y `delta.content` va vacío, pero el proveedor
      factura los tokens de razonamiento en `usage.completion_tokens`. Un acumulador que solo mire
      `content` registra 0 tokens de algo que ya está pagado. Medido el 2026-09-12 (JOURNAL).
    procedencia: >
      Transcripción REAL de Ollama 0.33.3, qwen3.5:4b-mlx, temperature 0, max_tokens 40, prompt
      "Dame un haiku sobre la lluvia.". Bytes tal cual, sin editar.
