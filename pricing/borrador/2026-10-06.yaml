# Tabla de precios de Evalgate · vigente desde el 2026-10-06 · contrato docs/CONTRACTS/pricing-table.md v1
#
# Ningún precio de aquí está inventado. Cada bloque dice de dónde sale:
#
# - Modelos Claude: precios de lista de la API de Anthropic, tabla "Model pricing" de la URL de `source`,
#   leída el 2026-10-06 y contrastada con una segunda copia de la misma tabla tomada ese día: las 19
#   filas coinciden. La página da USD por MILLÓN de tokens; aquí van por 1k, que es la unidad del contrato:
#   cada cifra se divide entre 1000 con aritmética exacta, sin redondear. La cifra original va en `note`.
#   `cache_write_per_1k` es la escritura de caché de 5 MINUTOS. La de 1 hora cuesta más y esta tabla no la
#   cubre: el contrato tiene un solo campo de escritura (ADR-013).
#   `id` sigue el patrón de los identificadores de la API (claude-<familia>-<versión>). La página lista
#   nombres comerciales, no identificadores: si un `id` no coincidiera con el `model` que devuelve la API,
#   esa llamada quedaría SIN PRECIO (nunca con un precio equivocado). El proxy no ha llamado a ninguno de
#   estos modelos: el proyecto usa solo modelos locales. Sirven para la columna "coste declarado" (contrato §4).
#   No se incluyen los recargos de la página (endpoints regionales +10 %, inference_geo "us" x1,1, modo
#   rápido) ni el descuento de lotes: son precio de lista, endpoint global.
# - Modelos locales (Ollama en esta máquina): 0, que es un precio y no una ausencia. Coste real incurrido
#   = 0 EUR (contrato §4). Son los tres modelos locales que usa el proyecto.
# - Tipo de cambio: referencia del BCE del 2026-10-06, 1 EUR = 1,1269 USD
#   (https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml). USD_EUR es su inverso,
#   1 / 1,1269 = 0,887390185…, a 6 decimales.
